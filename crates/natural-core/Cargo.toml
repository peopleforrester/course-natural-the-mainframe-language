[package]
name = "natural-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# natural-core deliberately has NO wasm-specific dependencies, so the TDD loop runs at
# native speed and the crate stays portable. Both dependencies below are pure Rust and
# compile to wasm32-unknown-unknown. Do not enable rust_decimal's "wasm" feature; it only
# adds JS interop glue, and the Natural edit mask is our formatting authority.
# See docs/gotchas-rust-wasm.md.
[dependencies]
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
thiserror = "2"
