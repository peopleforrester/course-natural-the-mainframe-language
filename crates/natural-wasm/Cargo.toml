[package]
name = "natural-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# cdylib produces the wasm module; rlib keeps `cargo test` able to link this crate
# natively. With cdylib alone the workspace test build fails.
# See docs/gotchas-rust-wasm.md.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
natural-core = { path = "../natural-core" }
wasm-bindgen = "0.2.126"

# wasm-pack's bundled wasm-opt is older than the wasm current rustc emits, which uses
# bulk-memory operations by default. Without these flags the build fails validation with
# "Bulk memory operations require bulk memory". Enabling the features keeps the
# optimization pass rather than turning wasm-opt off and shipping a larger module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
