<!-- ABOUTME: The course VTT: lesson instructions on the left, an editor and a 3270-styled
     ABOUTME: terminal on the right, running the Natural interpreter as client-side WebAssembly. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Natural: The Mainframe Language</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%96%A5</text></svg>">
<link rel="stylesheet" href="./vendor/xterm.css" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark">Natural</span>
      <span class="sub">The Mainframe Language</span>
    </div>
    <div class="spacer"></div>
    <div class="progresswrap" title="Exercises completed">
      <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>
      <span class="progresstext" id="progresstext">0 / 0</span>
    </div>
    <div class="lessonpick">
      <label for="lessonsel">Lesson</label>
      <select id="lessonsel"></select>
    </div>
  </header>

  <div class="split">
    <section class="guide" id="guide">
      <h1 id="lessontitle">Loading&hellip;</h1>
      <p class="lede" id="lessonlede"></p>
      <div id="steps"></div>
      <p class="foot">
        This course runs a teaching interpreter over a sample dataset in your browser.
        It is not a live ADABAS instance, and it implements a subset of Natural chosen
        for learning.
      </p>
    </section>

    <section class="termcol">
      <div class="termbar">
        <button class="tab active" data-pane="editor" id="tabeditor">EDITOR</button>
        <button class="tab" data-pane="terminal" id="tabterminal">TERMINAL</button>
        <button class="tab" data-pane="library" id="tablibrary">LIBRARY</button>
        <div class="spacer"></div>
        <button id="runbtn" class="act">Run &#9654;</button>
        <button id="resetbtn" class="act ghost">Reset</button>
        <select id="palette" class="act ghost" title="Phosphor">
          <option value="green">Green</option>
          <option value="amber">Amber</option>
        </select>
      </div>

      <!-- The editor. A Natural programmer works in a numbered source editor, so the
           gutter is not decoration: line numbers are how diagnostics are read. -->
      <div class="pane editorpane" id="editorpane">
        <div class="gutter" id="gutter"></div>
        <textarea id="editor" spellcheck="false" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  aria-label="Natural source editor"></textarea>
      </div>

      <!-- The library. A Natural program never stands alone: the subprograms it calls and
           the maps it shows are separate objects saved beside it under their own names.
           Showing them here is what makes that separation visible rather than asserted. -->
      <div class="pane librarypane" id="librarypane" hidden>
        <div id="librarylist"></div>
      </div>

      <div class="pane termpane" id="termpane" hidden>
        <div class="screenwrap">
          <div id="screen" class="screen"></div>
          <div class="crt" aria-hidden="true"></div>
        </div>
        <!-- AID keys. A 3270 ends a screen with one of these, and the program reads which
             one from *PF-KEY. -->
        <div class="aidbar" id="aidbar">
          <span class="aidlabel">END SCREEN WITH</span>
          <button data-aid="ENTR">Enter</button>
          <button data-aid="PF1">PF1</button>
          <button data-aid="PF3">PF3</button>
          <button data-aid="PF12">PF12</button>
        </div>
        <!-- The Operator Information Area. On a real 3270 this strip is where the terminal
             tells you what it is doing; here it turns interpreter state into a teaching
             surface. See research/08-mainframe-emulators-3270.md. -->
        <div class="oia" id="oia">
          <span class="oia-sys" id="oiaSys">4  A</span>
          <span class="oia-msg" id="oiaMsg"></span>
          <span class="spacer"></span>
          <span class="oia-pos" id="oiaPos">24/080</span>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
